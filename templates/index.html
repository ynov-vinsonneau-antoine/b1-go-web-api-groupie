<!DOCTYPE html>
<html lang="fr">
<head>
   <meta charset="UTF-8">
  <title>Groupie Tracker</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>Groupie Tracker</h1>

  <div class="grille">
    {{range .}}
      <div class="carte">
        <img src="{{.Image}}" alt="{{.Name}}">
        <h2>{{.Name}}</h2>
        <p>Créé en {{.CreationDate}}</p>
        <p>{{len .Members}} membres</p>
      </div>
    {{end}}
  </div>
</body>
</html>
